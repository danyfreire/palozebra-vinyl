name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build VST3 and smoke test
        shell: pwsh
        run: .\build-windows.ps1

      - name: Read project version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(PalozebraVinyl VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read Palozebra Vinyl version from CMakeLists.txt'
          }
          "PZ_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload VST3 build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Palozebra-Vinyl-Windows-VST3
          path: build/PalozebraVinyl_artefacts/Release/VST3/Palozebra Vinyl.vst3
          if-no-files-found: error

      - name: Package release ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $zip = "Palozebra-Vinyl-v$env:PZ_VERSION-Windows-x64-VST3.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build/PalozebraVinyl_artefacts/Release/VST3/Palozebra Vinyl.vst3" -DestinationPath $zip -CompressionLevel Optimal
          "PZ_RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release if missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PZ_VERSION"
          $notes = Get-Content RELEASE_NOTES.md -Raw
          if ($notes -notmatch [regex]::Escape($tag)) {
            throw "RELEASE_NOTES.md must mention $tag before publishing"
          }

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping publish."
            exit 0
          }

          gh release create $tag $env:PZ_RELEASE_ZIP `
            --repo "${{ github.repository }}" `
            --target $env:GITHUB_SHA `
            --title "Palozebra Vinyl $tag" `
            --notes-file RELEASE_NOTES.md
